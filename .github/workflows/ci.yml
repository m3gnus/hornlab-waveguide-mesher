name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (${{ matrix.os }}, ${{ matrix.deps }} deps)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # "wg" installs the numpy/scipy/gmsh/meshio versions Waveguide
        # Generator ships (.github/constraints-wg.txt), on the Python it ships,
        # on every OS it ships to. "latest" resolves whatever PyPI offers today
        # and catches an upstream release before WG adopts it; one OS is enough
        # for that early warning.
        os: [ubuntu-latest, macos-latest, windows-latest]
        deps: [wg]
        include:
          - os: ubuntu-latest
            deps: latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # WG ships CPython 3.13 (its server/requirements-lock.txt).
          python-version: "3.13"

      # gmsh ships a wheel but links against the system GL/GLU stack, which the
      # Linux runners do not carry by default. Importing it fails without this.
      - name: Install the system libraries gmsh links against
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Install (WG-pinned dependencies)
        if: matrix.deps == 'wg'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c .github/constraints-wg.txt -e ".[dev]"

      - name: Install (latest dependencies)
        if: matrix.deps == 'latest'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show the resolved versions
        run: python -c "import gmsh, meshio, numpy, scipy, sys; print(sys.version); print('gmsh', gmsh.__version__, 'meshio', meshio.__version__, 'numpy', numpy.__version__, 'scipy', scipy.__version__)"

      # tests/test_ath_reference_parity.py compares against a third-party
      # reference archive that is not part of this repository and is not
      # present on the runner. With ATH_REFERENCE_ROOT unset it skips
      # *silently*, so this job proves everything except parity, which stays a
      # release gate run where that archive is available.
      #
      # HORNLAB_ATH_PARITY is deliberately left unset. Setting it to "required"
      # turns those skips into errors, which is what you want when gating a
      # release and not what you want here.
      - name: Tests
        run: python -m pytest tests/ -v

      # A silent skip is indistinguishable from a deleted file, so assert the
      # parity suite still exists and still collects. This catches the case
      # where parity coverage disappears and every job stays green.
      - name: Parity suite is still present (it skips here by design)
        run: |
          python -m pytest tests/test_ath_reference_parity.py --collect-only -q
          echo "Parity collected, not executed: set ATH_REFERENCE_ROOT to run it."
